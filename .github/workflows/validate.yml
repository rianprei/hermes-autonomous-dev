name: Validate Hermes Autonomous Dev Kit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-linux:
    name: Validate on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hermes Agent
        run: pip install hermes-agent==0.15.2

      - name: Install Hermes Autonomous Dev Kit (Linux)
        env:
          HB_INSTALL_SRC: ${{ github.workspace }}
        run: |
          chmod +x wrappers/hb-install
          ./wrappers/hb-install

      - name: Verify Hermes installed
        run: hermes --version

      - name: Health check
        run: hb doctor

      - name: Test repo workflow
        run: |
          git init test-repo && cd test-repo
          git config user.email "ci@test"
          git config user.name "CI"
          echo "test" > file.txt && git add . && git commit -m "init"
          hb -q "echo hello from linux"

      - name: Test hb-auto requires flag
        run: |
          cd test-repo
          ! hb-auto "echo test" 2>&1 | grep -q "MODO OFF"
          echo "OK: hb-auto bloqueou sem flag"

      - name: Test hb-auto with flag accepted (first position)
        run: |
          cd test-repo
          hb-auto --confirm-i-accept-risks "echo test" 2>&1 | grep -q "MODO OFF" && exit 1 || echo "OK: flag aceita (primeira posicao)"

      - name: Test hb-auto with flag accepted (middle position)
        run: |
          cd test-repo
          hb-auto "echo test" --confirm-i-accept-risks 2>&1 | grep -q "MODO OFF" && exit 1 || echo "OK: flag aceita (meio)"

      - name: Test hb-auto with flag accepted (last position)
        run: |
          cd test-repo
          hb-auto "echo test" "arg2" --confirm-i-accept-risks 2>&1 | grep -q "MODO OFF" && exit 1 || echo "OK: flag aceita (ultima posicao)"

      - name: Test hb with dirty repo (should create stash)
        run: |
          cd test-repo
          echo "dirty" > dirty.txt
          hb -q "echo test" 2>&1 | grep -q "stash criado" && echo "OK: stash criado" || echo "OK: sem mudancas para stash"

      - name: Test hb doctor in non-git dir (should warn)
        run: |
          mkdir /tmp/non-git && cd /tmp/non-git
          hb doctor 2>&1 | grep -q "repo git" && echo "OK: hb doctor avisa sem git" || exit 1

      - name: Test hb doctor in empty git repo (creates .hermes.md)
        run: |
          mkdir /tmp/empty-git && cd /tmp/empty-git
          git init && git config user.email "ci@test" && git config user.name "CI"
          hb doctor 2>&1 | grep -q "ausente" && echo "OK: .hermes.md avisado ausente" || exit 1

      - name: Audit session
        run: |
          set +e
          hb audit 2>&1 | head -5
          echo "OK: hb audit command completed (exit code ignored)"

  validate-windows:
    name: Validate on Windows
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hermes Agent
        run: pip install hermes-agent==0.15.2

      - name: Install Git
        run: choco install git -y --no-progress

      - name: Install Hermes Autonomous Dev Kit (Windows)
        shell: pwsh
        env:
          HB_INSTALL_SRC: ${{ github.workspace }}
        run: |
          .\wrappers\windows\hb-install.ps1 -Source $env:HB_INSTALL_SRC

      - name: Verify Hermes installed
        run: hermes --version

      - name: Health check
        shell: pwsh
        run: |
          & "$HOME\.local\bin\hb.ps1" doctor

      - name: Test repo workflow (Windows)
        shell: pwsh
        run: |
          git init test-repo; cd test-repo
          git config user.email "ci@test"
          git config user.name "CI"
          "test" | Out-File -FilePath file.txt -Encoding utf8
          git add .; git commit -m "init"
          & "$HOME\.local\bin\hb.ps1" -q "echo hello from windows"

      - name: Test hb-auto Windows requires flag
        shell: pwsh
        run: |
          cd test-repo
          & "$HOME\.local\bin\hb-auto.ps1" "echo test"
          if ($LASTEXITCODE -eq 0) { exit 1 }
          Write-Host "OK: hb-auto bloqueou sem flag (exit $LASTEXITCODE)"
          exit 0

      - name: Test hb-auto Windows with flag accepted (first position)
        shell: pwsh
        run: |
          cd test-repo
          $output = & "$HOME\.local\bin\hb-auto.ps1" -ConfirmIAcceptRisks "echo test" 2>&1
          if ($output -match "MODO OFF") { exit 1 }
          Write-Host "OK: flag aceita (primeira posicao)"
          exit 0

      - name: Test hb-auto Windows with flag accepted (middle position)
        shell: pwsh
        run: |
          cd test-repo
          $output = & "$HOME\.local\bin\hb-auto.ps1" "echo test" -ConfirmIAcceptRisks 2>&1
          if ($output -match "MODO OFF") { exit 1 }
          Write-Host "OK: flag aceita (meio)"
          exit 0

      - name: Test hb-auto Windows with flag accepted (last position)
        shell: pwsh
        run: |
          cd test-repo
          $output = & "$HOME\.local\bin\hb-auto.ps1" "echo test" "arg2" -ConfirmIAcceptRisks 2>&1
          if ($output -match "MODO OFF") { exit 1 }
          Write-Host "OK: flag aceita (ultima posicao)"
          exit 0

      - name: Test hb Windows with dirty repo (should create stash)
        shell: pwsh
        run: |
          cd test-repo
          "dirty" | Out-File -FilePath dirty.txt -Encoding utf8
          $output = & "$HOME\.local\bin\hb.ps1" -q "echo test" 2>&1
          if ($output -match "stash criado") { Write-Host "OK: stash criado" } else { Write-Host "OK: sem mudancas para stash" }
          exit 0

      - name: Test hb doctor Windows in non-git dir (should fail)
        shell: pwsh
        run: |
          mkdir C:\temp\non-git; cd C:\temp\non-git
          $output = & "$HOME\.local\bin\hb.ps1" doctor 2>&1
          $ec = $LASTEXITCODE
          Write-Host "DEBUG exit code: $ec"
          Write-Host "DEBUG output: [$output]"
          if ($ec -ne 0 -and $output -match "repositorio") { Write-Host "OK: hb doctor falha sem git (exit $ec)"; exit 0 } else { Write-Host "FAIL: deveria falhar (exit $ec)"; exit 1 }

      - name: Test hb doctor Windows in empty git repo (creates .hermes.md)
        shell: pwsh
        run: |
          mkdir C:\temp\empty-git; cd C:\temp\empty-git
          git init; git config user.email "ci@test"; git config user.name "CI"
          $output = & "$HOME\.local\bin\hb.ps1" doctor 2>&1
          if ($output -match "ausente") { Write-Host "OK: .hermes.md avisado ausente"; exit 0 } else { Write-Host "FAIL: .hermes.md nao avisado"; exit 1 }

      - name: Audit session
        shell: pwsh
        run: |
          & "$HOME\.local\bin\hb.ps1" audit 2>&1 | head -5
          Write-Host "OK: hb.ps1 audit command completed (exit code ignored)"
          exit 0